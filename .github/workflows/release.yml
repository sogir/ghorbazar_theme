# Builds ecomx-bookshop.zip and publishes a GitHub Release whenever a
# version tag (v1.2.3) is pushed. Sites running the theme pick it up as
# a normal WordPress theme update (inc/updater.php) and auto-install it.
name: Release theme

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches style.css Version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -E '^\s*Version:' style.css | sed -E 's/.*Version:\s*//; s/\s*$//')
          echo "tag=$TAG style.css=$VER"
          if [ "$TAG" != "$VER" ]; then echo "::error::Tag v$TAG does not match style.css Version $VER"; exit 1; fi

      - name: Build zip
        run: |
          SLUG=ecomx-bookshop
          mkdir -p "build/$SLUG"
          rsync -a ./ "build/$SLUG/" \
            --exclude .git --exclude .github --exclude build --exclude bin \
            --exclude .gitignore --exclude .DS_Store --exclude config.php
          (cd build && zip -qr "$SLUG.zip" "$SLUG")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ecomx-bookshop.zip
          generate_release_notes: true
